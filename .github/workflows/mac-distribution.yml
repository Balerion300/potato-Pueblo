name: Mac distribution signature checks
on:
  push:
    branches: ['codex/pueblo-inline-images']
    paths: ['scripts/sign-mac-bundle.py', '.github/workflows/mac-distribution.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signatures:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare published Potato and working Atlantis signatures
        run: |
          mkdir -p audit
          curl -fL 'https://github.com/Balerion300/potato-Pueblo/releases/download/preview-2026-10-12-6f6cf20/Potato-Pueblo-Preview-Darwin-arm64.zip' -o audit/potato.zip
          curl -fL 'https://github.com/Balerion300/Atlantis/releases/download/pueblo-mxp-spacing-macos-2026-10-11/Atlantis-macOS-Apple-Silicon.zip' -o audit/atlantis.zip
          ditto -x -k audit/potato.zip audit/old
          ditto -x -k audit/atlantis.zip audit/atlantis
          python3 scripts/audit-mac-signatures.py
      - uses: actions/cache/restore@v4
        with:
          path: .build/runtime
          key: potato-static-8.6.18-macos-26-ARM64-v2
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: |
            .build/runtime/lib/tcltls2.0.1
            .build/runtime/TclTLS-LICENSE.txt
            .build/runtime/OpenSSL-LICENSE.txt
            .build/runtime/TLS-BUILD.txt
          key: potato-tls-2.0.1-openssl-3.5.9-macos-26-ARM64-v2
          fail-on-cache-miss: true
      - name: Build and verify assembled signed bundle
        run: python3 scripts/package-preview.py
      - name: Verify extracted signatures, native launch, protocol and SSL
        run: python3 scripts/verify-package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mac-distribution-signatures
          path: |
            audit/signatures.json
            artifacts/*.zip
          if-no-files-found: error
